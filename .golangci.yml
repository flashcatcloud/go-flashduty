# https://golangci-lint.run/usage/configuration
# Mirrors the flashcatcloud org convention (see flashduty-mcp-server). Generated
# files (header "// Code generated ... DO NOT EDIT.") are auto-excluded.
version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4
  # Type-check the env-gated E2E tests too (compiled, never run here).
  build-tags:
    - e2e

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - ineffassign
    - unused
    - misspell
    - nakedret
    - bodyclose
    - gocritic
    - makezero
    - gosec
  settings:
    staticcheck:
      checks:
        - all
        - '-QF1008' # allow embedded structs to be referenced by field
        - '-QF1001' # keep the explicit !(isAlnum) form; De Morgan rewrite is less readable
        - '-QF1011' # keep `var _ Iface = impl` interface-satisfaction guards with their type
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # Tests drive a fake in-memory RoundTripper (io.NopCloser bodies); there is
      # no connection to leak, and the SDK closes real response bodies internally.
      - path: _test\.go
        linters:
          - bodyclose
      # The code generator is a trusted maintainer build tool: it intentionally
      # emits world-readable (0644) source and reads a fixed in-repo spec path.
      - path: internal/cmd/gen/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gofmt:
      simplify: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/flashcatcloud/go-flashduty)

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
