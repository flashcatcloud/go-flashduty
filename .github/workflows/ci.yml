name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24', 'stable']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      # golangci-lint v2 subsumes gofmt, gci, staticcheck, govet and the rest;
      # config in .golangci.yml. Generated files are auto-excluded by header.
      # The official action ships a golangci-lint binary whose type-checker
      # matches the Go toolchain, avoiding stdlib version skew.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  generate-drift:
    name: Generate Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Run go generate
        run: go generate ./...

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "Generated files are out of date."
            echo "Run 'go generate ./...' locally and commit the result."
            exit 1
          fi
